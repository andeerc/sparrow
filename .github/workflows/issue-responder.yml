name: Issue Responder

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  respond:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@opencode')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@opencode'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install OpenCode
        run: npm install -g @opencode-ai/cli

      - name: Prepare prompt
        id: prompt
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER_IN: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          delimiter="PROMPT_EOF_${RANDOM}${RANDOM}"
          if [ "$EVENT_NAME" = "issues" ]; then
            {
              echo "PROMPT<<$delimiter"
              echo "Issue #$ISSUE_NUMBER_IN: $ISSUE_TITLE"
              echo ""
              echo "$ISSUE_BODY"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
            echo "ISSUE_NUMBER=$ISSUE_NUMBER_IN" >> "$GITHUB_ENV"
          else
            {
              echo "PROMPT<<$delimiter"
              echo "@opencode foi mencionado no issue #$ISSUE_NUMBER_IN"
              echo ""
              echo "Comentário:"
              echo "$COMMENT_BODY"
              echo ""
              echo "Responda como um desenvolvedor Rust senior, ajudando com código e arquitetura."
              echo "$delimiter"
            } >> "$GITHUB_ENV"
            echo "ISSUE_NUMBER=$ISSUE_NUMBER_IN" >> "$GITHUB_ENV"
          fi

      - name: Run OpenCode
        id: opencode
        run: |
          echo "$PROMPT" | opencode run --agent build --model opencode-go/deepseek-v4-flash --format json > response.json 2>&1 || true
          delimiter="RESPONSE_EOF_${RANDOM}${RANDOM}"
          {
            echo "RESPONSE<<$delimiter"
            jq -r '.text // . // empty' response.json
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Post comment
        if: env.RESPONSE != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const response = process.env.RESPONSE || '';
            const body = `## 🤖 Resposta do @opencode\n\n${response}\n\n---\n*Gerado automaticamente pelo OpenCode CI. Para evitar respostas automáticas, não mencione @opencode.*`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body,
            });
