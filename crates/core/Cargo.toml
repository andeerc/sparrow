[package]
name = "sparrow-core"
version = "0.1.0"
edition = "2021"

[dependencies]
sparrow-proto = { path = "../proto" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
