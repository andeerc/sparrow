[package]
name = "sparrow-podman"
version = "0.2.3"
edition = "2021"

[dependencies]
sparrow-proto = { path = "../proto" }

tokio = { version = "1", features = ["process", "rt", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
