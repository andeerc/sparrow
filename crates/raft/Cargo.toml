[package]
name = "sparrow-raft"
version = "0.1.0"
edition = "2021"

[dependencies]
sparrow-proto = { path = "../proto" }

openraft = { version = "0.10.0-alpha.22", features = ["type-alias", "serde"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
tracing = "0.1"
async-trait = "0.1"
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
