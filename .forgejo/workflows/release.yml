name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq curl build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # ── Build Rust binary ──
      - name: Build binary
        run: cargo build --release --locked

      # ── Build Docker image ──
      - name: Build Docker image
        run: |
          docker build \
            -t codeberg.org/andeerc/sparrow:${GITHUB_REF_NAME} \
            -t codeberg.org/andeerc/sparrow:latest \
            .

      # ── Push to Codeberg Container Registry ──
      - name: Push to Codeberg Packages
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login codeberg.org -u andeerc --password-stdin
          docker push codeberg.org/andeerc/sparrow:${GITHUB_REF_NAME}
          docker push codeberg.org/andeerc/sparrow:latest

      # ── Create Release with binary asset ──
      - name: Create Release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          # Create release via Forgejo API
          RELEASE_JSON=$(curl -s -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${GITHUB_REF_NAME}\",\"name\":\"Sparrow ${GITHUB_REF_NAME}\",\"body\":\"Sparrow container orchestrator — ${GITHUB_REF_NAME}\"}" \
            "https://codeberg.org/api/v1/repos/andeerc/sparrow/releases")

          # Extract release ID
          RELEASE_ID=$(echo "$RELEASE_JSON" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

          # Upload binary asset
          curl -s -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -F "attachment=@target/release/sparrow;filename=sparrow-${GITHUB_REF_NAME}-x86_64-linux" \
            "https://codeberg.org/api/v1/repos/andeerc/sparrow/releases/${RELEASE_ID}/assets"
