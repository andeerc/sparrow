name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ── Build Rust binary ──
      - name: Build binary
        run: cargo build --release --locked

      # ── Rename binary to platform asset name ──
      - name: Stage asset
        run: cp target/release/sparrow sparrow-${{ github.ref_name }}-x86_64-linux

      # ── Create GitHub Release with binary asset ──
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Sparrow ${{ github.ref_name }}
          body: Sparrow container orchestrator — ${{ github.ref_name }}
          files: sparrow-${{ github.ref_name }}-x86_64-linux

      # ── Build + push Docker image to GHCR ──
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/andeerc/sparrow:${{ github.ref_name }}
            ghcr.io/andeerc/sparrow:latest
